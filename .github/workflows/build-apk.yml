name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME) com as licenças aceitas.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Testes unitários
        shell: bash
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon > gradle-test.log 2>&1
          code=$?
          tail -n 40 gradle-test.log
          exit $code
      - name: Resumo dos erros nos testes
        if: ${{ failure() }}
        shell: bash
        run: |
          # Publica os erros como anotações (visíveis na página da execução, sem baixar log).
          grep -E "^e: |error:|FAILED|AssertionError|Exception|Test.*>" gradle-test.log | head -n 30 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - name: Compilar
        if: ${{ !cancelled() }}
        run: gradle assembleRelease --no-daemon
      - name: Relatório de testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: CeratoDash-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
